name: Core StackPacks CI

run-name: >-
  core stackpacks -
  ${{ github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.number, github.event.pull_request.title) ||
      github.event_name == 'workflow_dispatch' && 'manual rebuild' ||
      github.event_name == 'push' && format('{0}: {1}', github.ref_name, github.event.head_commit.message) ||
      github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: core-stackpacks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zizmor:
    name: Workflow security (Zizmor)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Audit workflows and actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          collect: all
          inputs: .

  discover-stackpacks:
    name: Discover stackpacks
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_stackpacks: ${{ steps.discover.outputs.has_stackpacks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Discover stackpack directories
        id: discover
        run: |
          stackpacks=()
          if [[ -d stackpacks ]]; then
            for dir in stackpacks/*; do
              [[ -d "${dir}" && -f "${dir}/stackpack.yaml" ]] || continue
              stackpacks+=("$(basename "${dir}")")
            done
          fi

          if [[ ${#stackpacks[@]} -eq 0 ]]; then
            echo 'matrix={"stackpack":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_stackpacks=false' >> "$GITHUB_OUTPUT"
            echo "No stackpacks discovered"
            exit 0
          fi

          matrix=$(printf '%s\n' "${stackpacks[@]}" | jq -R . | jq -cs '{stackpack:.}')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo 'has_stackpacks=true' >> "$GITHUB_OUTPUT"
          echo "Discovered stackpacks: ${stackpacks[*]}"

  validate:
    needs: [discover-stackpacks]
    if: ${{ needs.discover-stackpacks.outputs.has_stackpacks == 'true' }}
    name: validate (${{ matrix.stackpack }})
    runs-on: ubuntu-24.04
    env:
      VALIDATOR_IMAGE: quay.io/stackstate/stackstate-server:7.0.0-snapshot.20261012082244-master-05004e2-2.5@sha256:2b980e1e2948eff5892e5815ed0d4a17780b8312b1eb2831234fdf7cfacfab8c
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stackpacks.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate ${{ matrix.stackpack }}
        env:
          STACKPACK: ${{ matrix.stackpack }}
        run: bash scripts/ci/validate_stackpack.sh "stackpacks/${STACKPACK}"

      - name: Verify validator rejects an invalid mapping expression
        run: |
          output=$(mktemp)
          if bash scripts/ci/validate_stackpack.sh tests/fixtures/invalid-component-mapping >"${output}" 2>&1; then
            cat "${output}"
            echo "Validator accepted an invalid mapping" >&2
            exit 1
          fi
          cat "${output}"
          grep -q "undeclared.*undeclaredValidationControl" "${output}"

  package:
    name: package (${{ matrix.stackpack }})
    needs: [discover-stackpacks, validate, check-version-bump]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.check-version-bump.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stackpacks.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yq

      - name: Install StackState CLI
        env:
          CLI_VERSION: 3.9.5
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "${tmp}"' EXIT
          archive="stackstate-cli-${CLI_VERSION}.linux-x86_64.tar.gz"
          base="https://dl.stackstate.com/stackstate-cli/v${CLI_VERSION}"
          curl --fail --silent --show-error --location "${base}/${archive}" -o "${tmp}/${archive}"
          curl --fail --silent --show-error --location \
            "${base}/stackstate-cli_${CLI_VERSION}_checksums.txt" -o "${tmp}/checksums.txt"
          (cd "${tmp}" && awk -v archive="${archive}" '$2 == archive { print }' checksums.txt | sha256sum --check --strict)
          tar xzf "${tmp}/${archive}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/sts" /usr/local/bin/sts
          sts version

      - name: Package ${{ matrix.stackpack }}
        env:
          STACKPACK: ${{ matrix.stackpack }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          cd "stackpacks/${STACKPACK}"
          base_version=$(yq -r '.version' stackpack.yaml)
          echo "Version from stackpack.yaml: ${base_version}"

          if [[ "${EVENT_NAME}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            stackpack_version=${base_version}
          else
            major=$(echo "${base_version}" | cut -d. -f1)
            minor=$(echo "${base_version}" | cut -d. -f2)
            patch=$(echo "${base_version}" | cut -d. -f3)
            new_patch=$((patch + 1))
            branch_sanitized=${BRANCH_NAME//[^a-zA-Z0-9]/-}
            short_sha="${SHA:0:7}"
            stackpack_version="${major}.${minor}.${new_patch}-${branch_sanitized}-${RUN_NUMBER}-${short_sha}-SNAPSHOT"
            sed -i "s/^version: .*/version: \"${stackpack_version}\"/" stackpack.yaml
          fi

          export STS_EXPERIMENTAL_STACKPACKS=1
          sts stackpack package
          mkdir -p target
          mv -- *.sts target/
          ls -lh target/*.sts

      - name: Upload ${{ matrix.stackpack }} sts artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sts-${{ matrix.stackpack }}
          path: stackpacks/${{ matrix.stackpack }}/target/*.sts
          if-no-files-found: error

  check-version-bump:
    needs: [discover-stackpacks]
    if: ${{ needs.discover-stackpacks.outputs.has_stackpacks == 'true' }}
    name: Check version bump
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stackpacks.outputs.matrix) }}
    env:
      TARGET_BRANCH: ${{ github.base_ref || 'main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yq

      - name: Compare versions
        env:
          STACKPACK: ${{ matrix.stackpack }}
        run: ./scripts/ci/verify_versions_bumped.sh "${STACKPACK}"

  build-image:
    name: Bundle build, smoke test, Trivy secret and vulnerability gate (${{ matrix.arch }})
    needs: [package, zizmor]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download packaged StackPacks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sts-*
          path: docker/rootfs/stackpacks
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build bundle and verify packaged content
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          local_ref="local/core-stackpacks:${ARCH}"
          docker buildx build --platform "linux/${ARCH}" --load \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label 'org.opencontainers.image.title=SUSE Observability Core StackPacks' \
            --tag "${local_ref}" docker
          actual_arch=$(docker image inspect "${local_ref}" --format '{{.Architecture}}')
          [[ "${actual_arch}" == "${ARCH}" ]]
          cid=$(docker create --platform "linux/${ARCH}" --entrypoint /bin/sh "${local_ref}")
          tmp=$(mktemp -d)
          trap 'docker rm -f "${cid}" >/dev/null; rm -rf "${tmp}"' EXIT
          docker cp "${cid}:/stackpacks/." "${tmp}/"
          diff <(cd docker/rootfs/stackpacks && sha256sum -- *.sts | sort) \
               <(cd "${tmp}" && sha256sum -- *.sts | sort)
          [[ $(find "${tmp}" -maxdepth 1 -type f -name '*.sts' | wc -l) -gt 0 ]]
      - name: Trivy secret and vulnerability gate
        uses: StackVista/image-pipeline/.github/actions/scan-image@6869879307d976158fa07ee5bff27ceb8eb031af # v1.0.0
        with:
          image: local/core-stackpacks:${{ matrix.arch }}
          mode: gate
          severity: HIGH,CRITICAL
          with-grype: true
          upload-sarif: false
          sarif-category: core-stackpacks-${{ matrix.arch }}
      - name: Save tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p target
          docker save "local/core-stackpacks:${ARCH}" -o "target/image-${ARCH}.tar"
      - name: Upload tested image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-image-${{ matrix.arch }}
          path: target/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3

  publish-image:
    name: Publish and sign tested core bundle
    needs: [build-image]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-image-*
          path: images
          merge-multiple: true
      - name: Compute image identity
        id: image
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          branch="${BRANCH_NAME//[^a-zA-Z0-9_.-]/-}"
          short_sha=$(git rev-parse --short=7 HEAD)
          timestamp=$(TZ=UTC0 git log -1 --format=%cd --date=format-local:'%Y%m%d%H%M%S')
          tag="${timestamp}-${branch}-${short_sha}"
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            tag="${tag}-retry-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "ref=quay.io/stackstate/core-stackpacks" >> "${GITHUB_OUTPUT}"
      - name: Publish and sign the tested images
        uses: StackVista/image-pipeline/.github/actions/scan-sign-push@6869879307d976158fa07ee5bff27ceb8eb031af # v1.0.0
        with:
          image: ${{ steps.image.outputs.ref }}
          tags: ${{ steps.image.outputs.tag }}
          arches: amd64,arm64
          source-mode: tarball
          tarball-dir: images
          target-registry: quay.io
          target-registry-user: ${{ secrets.QUAY_USER }}
          target-registry-password: ${{ secrets.QUAY_PASSWORD }}
          severity: HIGH,CRITICAL
          with-grype: true
          upload-sarif: false
      - name: Verify anonymous image access
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.tag }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "${tmp}"' EXIT
          if ! DOCKER_CONFIG="${tmp}" docker buildx imagetools inspect "${IMAGE_REF}" >/dev/null; then
            echo 'The published Quay image must permit anonymous pulls before the chart can use it.' >&2
            exit 1
          fi

  update-stackpacks-version-in-helm:
    name: Update stackpacks version in helm-charts-internal
    needs: [publish-image]
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.publish-image.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HELM_CHARTS_INTERNAL_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELM_CHARTS_INTERNAL_GH_APP_PRIVATE_KEY }}
          repositories: helm-charts-internal
          permission-actions: write

      - name: Trigger helm-charts-internal updatecli workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{
              "ref": "master",
              "inputs": {
                "pipeline": "stackpacks",
                "target_branch": "master",
                "stackpacks_source_branch": "master",
                "stackpacks_contrib_source_branch": "main",
                "stackpacks_suse_source_branch": "main",
                "dry_run": "false"
              }
            }' \
            "https://api.github.com/repos/StackVista/helm-charts-internal/actions/workflows/updatecli.yml/dispatches"
